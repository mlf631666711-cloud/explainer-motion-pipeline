<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>镜头模板 · 一屏三卡 + 点亮（6s）</title>
<!--
  说明：这是可以直接改的「一镜」模板。
  ① 保持 #stage 1920×1080、window.DUR、render(t) 三件契约不变；
  ② 所有时间点写在底部 TIMELINE 里，改时间只改那一处；
  ③ 上下 154px 是留给进度条/字幕的，内容不许进去；
  ④ 横向要占满（≥1600px），别把整屏 scale 缩小。
-->
<style>
:root{--paper:#F7F7F3;--ink:#16181C;--ink2:#5A6068;--ink3:#9AA0A8;--rule:#D2D8E1;--rule2:#B9C1CD;--sig:#C8342A}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111}
#stage{position:relative;width:1920px;height:1080px;background:var(--paper);overflow:hidden;transform-origin:0 0;
 font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

/* 底：方格纸（计量件，闸门不把它算内容） */
#grid{position:absolute;inset:0;background-image:
 linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px),
 linear-gradient(var(--rule2) 1px,transparent 1px),linear-gradient(90deg,var(--rule2) 1px,transparent 1px);
 background-size:64px 64px,64px 64px,320px 320px,320px 320px;opacity:.6}

/* 标题：遮罩滑入 */
#ttl{position:absolute;left:130px;top:156px;margin:0;font-size:88px;font-weight:800;letter-spacing:-4px;line-height:1}
#ttl .ln{display:block;overflow:hidden;height:94px}
#ttl .ln>span{display:block;transform:translateY(104%)}
#ttl em{font-style:normal;color:var(--sig)}
#ul{position:absolute;left:130px;top:268px;height:7px;width:0;background:var(--sig)}

/* 三张卡：硬边 + 硬投影 */
.card{position:absolute;top:380px;width:500px;height:340px;background:#fff;border:3px solid var(--ink);
 box-shadow:9px 9px 0 rgba(22,24,28,.12);padding:30px 32px;opacity:0}
.card .no{font-family:ui-monospace,monospace;font-size:22px;font-weight:700;letter-spacing:3px;color:var(--ink3)}
.card .k{position:absolute;left:32px;bottom:34px;font-size:46px;font-weight:800;letter-spacing:-1.5px}
#c1{left:130px} #c2{left:710px} #c3{left:1290px}

/* 收尾：一条括号把三张卡括起来（旁白说"这些是同一类"时才用） */
#brk{position:absolute;left:130px;top:790px;height:3px;width:0;background:var(--ink3)}

</style></head><body>
<div id="stage">
 <div id="grid" class="meter"></div>

 <h1 id="ttl"><span class="ln"><span>示例<em>镜头</em></span></span></h1>
 <div id="ul"></div>

 <div class="card" id="c1"><div class="no">01 / FIRST</div><div class="k">第一项</div></div>
 <div class="card" id="c2"><div class="no">02 / SECOND</div><div class="k">第二项</div></div>
 <div class="card" id="c3"><div class="no">03 / THIRD</div><div class="k">第三项</div></div>

 <div id="brk"></div>
</div>
<script>
/* ===== 契约（别改） ===== */
var W=1920,H=1080,DUR=6.00;

/* ===== 缓动六件套 ===== */
function cl(x){return x<0?0:(x>1?1:x);}
function sm(x){x=cl(x);return x*x*x*(x*(x*6-15)+10);}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3);}
function eio(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
function ob(x){x=cl(x);var c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
function seg(t,a,b){return (t-a)/(b-a);}

function fit(){var k=Math.min(innerWidth/W,innerHeight/H);
  document.getElementById('stage').style.transform='translate('+((innerWidth-W*k)/2)+'px,'+((innerHeight-H*k)/2)+'px) scale('+k+')';}
addEventListener('resize',fit);fit();
function $(i){return document.getElementById(i);}

/* ===== 时间轴（改这里就行） ===== */
var TIMELINE = {
  title : 0.00,          // 标题滑入
  ul    : 0.55,          // 红线划出
  cards : 1.20,          // 三张卡开始错峰落位（间隔 0.14）
  lit   : 2.90,          // 第二张卡点亮
  brk   : 4.00           // 括号收拢
};

var G=$('grid'), TTL=$('ttl'), L1=$('ttl').querySelector('.ln>span'), UL=$('ul'),
    BRK=$('brk'), CARDS=[$('c1'),$('c2'),$('c3')];

function render(t){
  G.style.transform = 'translate('+(Math.sin(t*.05)*9).toFixed(2)+'px,'+(Math.cos(t*.04)*7).toFixed(2)+'px)';

  /* 1 · 标题：遮罩滑入（不是淡入） */
  L1.style.transform = 'translateY('+((1-sm(seg(t,TIMELINE.title,TIMELINE.title+0.50)))*104).toFixed(1)+'%)';

  /* 2 · 红线：从左划出 */
  UL.style.width = (490*eio(seg(t,TIMELINE.ul,TIMELINE.ul+0.85))).toFixed(1)+'px';

  /* 3 · 三卡：错峰落位（回弹），随后第二张点亮 */
  for(var i=0;i<3;i++){
    var t0 = TIMELINE.cards + i*0.14;
    var a  = cl(seg(t,t0,t0+0.50));
    var lit= sm(seg(t,TIMELINE.lit,TIMELINE.lit+0.34)) * (i===1?1:0);
    CARDS[i].style.opacity = sm(a).toFixed(2);
    CARDS[i].style.transform = 'translateY('+((1-ob(a))*40).toFixed(1)+'px) scale('+(0.96+0.04*ob(a)+0.022*lit).toFixed(3)+')';
    CARDS[i].style.borderColor = lit>0.5 ? 'var(--sig)' : 'var(--ink)';
    CARDS[i].style.boxShadow = '0 0 0 '+(7*lit).toFixed(1)+'px rgba(200,52,42,'+(0.15*lit).toFixed(2)+'),9px 9px 0 rgba(22,24,28,.12)';
    CARDS[i].querySelector('.k').style.color = lit>0.5 ? 'var(--sig)' : 'var(--ink)';
  }

  /* 4 · 括号：从左扫到右 */
  BRK.style.width = (1660*eio(seg(t,TIMELINE.brk,TIMELINE.brk+1.30))).toFixed(1)+'px';
}
window.render = render;

/* ===== 预览 / 播放（别改：闸门与渲染器都靠 ?t= 与 __hold） ===== */
var Q=new URLSearchParams(location.search);
if(Q.has('t')){var tf=parseFloat(Q.get('t'))||0;(function L(){if(!window.__hold)render(tf);requestAnimationFrame(L);})();}
else{var t0=performance.now();(function L(n){if(window.__hold){requestAnimationFrame(L);return;}
  render(Math.min(DUR,(n-t0)/1000));requestAnimationFrame(L);})(t0);}
</script></body></html>
